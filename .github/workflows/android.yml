# Builds the signed beta APK, by hand: Actions > Android > Run workflow. That is the only
# trigger — nothing runs on a push, no release and no tag is ever created.
#
# The APK is the artifact of the run (run page > Artifacts), kept 14 days: download it there
# and install it over the previous build. Nothing else is published, nothing is written to a
# changelog.
#
# One job, one Gradle run: the checkout, the JDK, the Android SDK and the Gradle caches are
# paid for once, and ~/.gradle/caches (dependencies, build cache) and ~/.gradle/wrapper (the
# Gradle distribution) are restored between runs, so a build that changes no version pays for
# the minified release compile alone.
name: Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName (stays 1.0.0: only the versionCode grows, so builds still install over each other)'
        required: false
        default: '1.0.0'
      tests:
        description: 'Run the unit tests first (slower)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: base

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      # The version is the one typed in, never read from a file: this workflow keeps no
      # changelog and appends nothing anywhere.
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          VERSION="${VERSION:-1.0.0}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Unit tests
        if: github.event.inputs.tests == 'true'
        run: ./gradlew testDebugUnitTest :api:test :api-spotify:test :host-cdp:test

      # The beta key, from the repository secrets (C:\Users\Administrator\.aurora\beta.jks on
      # the machine that set them up: keep it, or no later build can update an installed beta).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYSPOTI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::MYSPOTI_KEYSTORE_BASE64 secret missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # -PappBeta=true: the "app.myspoti" id and the "Myspoti Beta" label, whatever the version
      # is called, so a 1.0.0 build installs over the 1.0.0 build before it. The versionCODE is
      # still the run number: Android refuses an update whose code did not grow, so the name can
      # stay the same while the build moves on.
      #
      # -PupdateRepo is NOT passed: BuildConfig.UPDATE_REPO stays empty and the app checks no
      # releases at all. With the version name back at 1.0.0, a published 2.0.2-beta.4 counted as
      # "newer" and the beta offered an update downwards, over and over.
      - name: Signed beta APK
        env:
          MYSPOTI_KEYSTORE: ${{ runner.temp }}/release.jks
          MYSPOTI_KEYSTORE_PASSWORD: ${{ secrets.MYSPOTI_KEYSTORE_PASSWORD }}
          MYSPOTI_KEY_ALIAS: ${{ secrets.MYSPOTI_KEY_ALIAS }}
          MYSPOTI_KEY_PASSWORD: ${{ secrets.MYSPOTI_KEY_PASSWORD }}
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          ./gradlew assembleRelease \
            -PappBeta=true \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$((1000 + GITHUB_RUN_NUMBER))"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Aurora-$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: Aurora-${{ steps.version.outputs.version }}
          path: base/app/build/outputs/apk/release/Aurora-*.apk
          if-no-files-found: error
          retention-days: 14
